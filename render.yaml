services:
  - type: web
    name: property-sce-master-api
    runtime: docker
    rootDir: apps/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: property-sce-master-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: "*"
      - key: AI_PROVIDER
        value: demo
      - key: DEMO_ADMIN_EMAIL
        value: admin@sce.local
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: LEAD_WEBHOOK_SECRET
        sync: false
      - key: LEAD_WEBHOOK_WORKSPACE_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_GRAPH_VERSION
        value: v24.0
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_SIGNATURE_MAX_AGE_SECONDS
        value: "300"
  - type: web
    name: property-sce-master-web
    runtime: static
    buildCommand: ""
    staticPublishPath: .
databases:
  - name: property-sce-master-db
    plan: free
    databaseName: sce_master
    user: sce
