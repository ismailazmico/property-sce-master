services:
  - type: web
    name: property-sce-master-api
    runtime: docker
    rootDir: apps/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: property-sce-master-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://property-sce-master-web.onrender.com
      - key: AI_PROVIDER
        value: demo

  - type: web
    name: property-sce-master-web
    runtime: static
    rootDir: apps/web
    buildCommand: ""
    staticPublishPath: .

databases:
  - name: property-sce-master-db
    databaseName: sce_master
    user: sce
